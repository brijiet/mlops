services:

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest

    ports:
      - "5000:5000"

    volumes:
      - ./mlflow.db:/mlflow.db
      - ./mlartifacts:/mlartifacts

    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow.db
      - --artifacts-destination
      - /mlartifacts
      - --allowed-hosts
      - "mlflow:5000,localhost:5000,127.0.0.1:5000"

    restart: unless-stopped


  api:
    image: ghcr.io/brijiet/mlops-churn-api:1.0

    ports:
      - "8000:8000"

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

    depends_on:
      - mlflow

    restart: unless-stopped