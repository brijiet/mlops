services:

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest

    ports:
      - "5000:5000"

    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"

  api:
    build:
      context: .

    ports:
      - "8000:8000"

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: CustomerChurnModel
      MODEL_ALIAS: champion

    depends_on:
      - mlflow